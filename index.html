<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persicco — Disponibilidad de productos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
  /* ── Reset & base ── */
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fbf7f0;color:#2b2118;font-family:"Archivo","Inter",system-ui,sans-serif;font-size:14px;min-height:100vh;font-variant-numeric:tabular-nums}
  a{color:inherit;text-decoration:none}

  /* ── Topbar ── */
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;background:#f2e9db;border-bottom:1px solid #e3d5c0;position:sticky;top:0;z-index:20}
  .topbar-logo{height:44px;width:auto;display:block}
  .topbar-title{font-size:19px;font-weight:700;letter-spacing:-.3px;color:#2b2118}
  .topbar-sub{font-size:12px;color:#8c7b66;margin-top:2px}
  .topbar-right{margin-left:auto;text-align:right}
  .upd-badge{font-size:11px;color:#a3937d;display:flex;align-items:center;gap:5px;justify-content:flex-end}
  .upd-dot{width:7px;height:7px;border-radius:50%;background:#6a8f36;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── Layout: sidebar + detail ── */
  .layout{display:flex;max-width:1400px;margin:0 auto;align-items:flex-start}
  .sidebar{width:290px;flex-shrink:0;background:#f2e9db;border-right:1px solid #e3d5c0;padding:16px 10px 40px;position:sticky;top:73px;height:calc(100vh - 73px);overflow-y:auto}
  .sidebar-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:0 6px}
  .mini-chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:3px}
  .mini-chip.warn{background:#f7dfcb;color:#a3512b}
  .mini-chip.ok{background:#e4edd3;color:#4f6b2a}
  .mini-chip.neu{background:#eadfcd;color:#8c7b66}

  .suc-item{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:8px;cursor:pointer;margin-bottom:3px;transition:.15s;border:1px solid transparent}
  .suc-item:hover{background:rgba(196,90,45,.07)}
  .suc-item.active{background:#fff;border-color:#e3d5c0;box-shadow:0 1px 2px rgba(72,52,32,.06)}
  .suc-item .li-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2b2118}
  .suc-item.overview-item .li-name{font-weight:700}
  .li-badge{background:#c45a2d;color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0;min-width:20px;text-align:center}
  .li-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .li-dot.ok{background:#6a8f36}
  .li-dot.gray{background:#c9bba6}
  .closed-tag{font-size:8.5px;font-weight:700;background:#faedd6;color:#b07a2e;padding:2px 6px;border-radius:5px;flex-shrink:0}
  .fab-tag{font-size:8.5px;font-weight:700;background:#ece5f7;color:#7a5aa8;padding:2px 6px;border-radius:5px;flex-shrink:0}
  .ok-tag{font-size:8.5px;font-weight:700;background:#e4edd3;color:#4f6b2a;padding:2px 6px;border-radius:5px;flex-shrink:0;letter-spacing:.3px}
  .nodata-tag{font-size:8.5px;font-weight:700;background:#eadfcd;color:#8c7b66;padding:2px 6px;border-radius:5px;flex-shrink:0;letter-spacing:.3px}
  .suc-item.fab-item{background:rgba(122,90,168,.06)}
  .sidebar-divider{height:1px;background:#e3d5c0;margin:10px 6px 12px}
  .fab-banner{background:#f4f0fa;border:1px solid #ddd2ee;border-radius:10px;padding:10px 14px;color:#6b4d99;font-size:12px;display:flex;align-items:center;gap:8px;margin-bottom:16px}

  .detail{flex:1;min-width:0;padding:26px 30px 60px}

  /* ── Summary cards (overview) ── */
  .summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .sum-card{background:#fff;border:1px solid #efe4d3;border-radius:12px;padding:15px 20px;flex:1;min-width:140px;box-shadow:0 1px 2px rgba(72,52,32,.04)}
  .sum-card .num{font-size:28px;font-weight:700;line-height:1;color:#2b2118}
  .sum-card .lbl{font-size:11px;color:#a3937d;margin-top:5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .sum-card.warn .num{color:#c45a2d}
  .sum-card.ok .num{color:#4f6b2a}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

  /* ── Cards (overview grid) ── */
  .card{background:#fff;border:1px solid #efe4d3;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:11px;transition:.2s;cursor:pointer;box-shadow:0 1px 2px rgba(72,52,32,.04)}
  .card:hover{border-color:#d9c4a8;transform:translateY(-2px);box-shadow:0 6px 20px rgba(72,52,32,.09)}
  .card.all-ok{background:#f4f7ec;border-color:#dbe6c8}
  .card.has-falt{border-color:#efe4d3}
  .card.cerrada{background:#fdf8ef;border-color:#f0e0c4}
  .card.sin-datos{opacity:.6}

  .card-head{display:flex;align-items:flex-start;gap:10px}
  .card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .card-icon.ok{background:#e4edd3}
  .card-icon.falt{background:#f7dfcb}
  .card-icon.cerr{background:#faedd6}
  .card-icon.nd{background:#eadfcd}
  .card-name{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.2px;color:#2b2118}
  .card-addr{font-size:11px;color:#a3937d;margin-top:3px}

  /* Tags */
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:3px}
  .tag.ok{background:#e4edd3;color:#4f6b2a;border:1px solid #cfdfb6}
  .tag.falt{background:#f7dfcb;color:#a3512b;border:1px solid #ecc9ab}
  .tag.cerr{background:#faedd6;color:#b07a2e;border:1px solid #f0dcb4}
  .tag.nd{background:#eadfcd;color:#8c7b66;border:1px solid #ddcdb4}

  /* Sections */
  .sec-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#a3937d;padding-bottom:6px;border-bottom:1px solid #f0e7d9;display:flex;align-items:center;justify-content:space-between}
  .sec-cnt{font-size:11px;color:#8c7b66}
  .falt-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto;padding-right:2px}
  .falt-item{font-size:12px;color:#a3512b;padding:3px 0;border-bottom:1px solid #f5e6da}
  .falt-item:last-child{border:none}
  .ok-line{font-size:12px;color:#4f6b2a;padding:3px 0;display:flex;align-items:center;gap:5px}
  .ok-line2{font-size:12px;color:#6f6252;padding:2px 0}

  /* Mini-filas del resumen */
  .mini-rows{display:flex;flex-direction:column;gap:1px;margin-top:2px}
  .mini-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(139,120,96,.13)}
  .mini-row:last-child{border-bottom:none}
  .mini-row .mr-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0}
  .mini-row .mr-label{font-size:12.5px;font-weight:500;color:#6f6252;flex:1;min-width:0}
  .mini-row .mr-val{font-size:13.5px;font-weight:700;white-space:nowrap}
  .mini-row .mr-val.bad{color:#c45a2d}
  .mini-row .mr-val.ok{color:#6a8f36;font-size:12.5px;font-weight:700}
  .mini-row .mr-val.na{color:#bcae9a;font-size:11.5px;font-weight:600;font-style:italic}
  .mini-row .mr-de{font-size:11px;font-weight:600;color:#a3937d;font-style:normal}

  /* Banner cerrada */
  .cerr-banner{background:#faedd6;border:1px solid #f0dcb4;border-radius:10px;padding:10px 14px;color:#8a5d1c;font-size:12px;display:flex;align-items:center;gap:8px}

  /* ── Detail view (single sucursal) ── */
  .detail-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
  .detail-head-row .detail-head{margin-bottom:0;flex:1;min-width:0}
  .detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}

  /* ── Botón enviar faltantes ── */
  .send-wrap{position:relative;flex-shrink:0}
  .send-btn{display:inline-flex;align-items:center;gap:8px;background:#c45a2d;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer;border:none;box-shadow:0 2px 8px rgba(196,90,45,.25);transition:.18s;white-space:nowrap}
  .send-btn:hover{background:#a3512b;transform:translateY(-1px);box-shadow:0 4px 14px rgba(196,90,45,.32)}
  .send-btn:active{transform:translateY(0)}
  .send-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid #e3d5c0;border-radius:12px;padding:8px;min-width:230px;max-width:calc(100vw - 40px);box-shadow:0 14px 36px rgba(72,52,32,.18);z-index:30;display:none}
  .send-menu.open{display:block}
  .send-menu-hint{font-size:10px;color:#a3937d;text-transform:uppercase;letter-spacing:.4px;padding:4px 10px 8px;font-weight:700}
  .send-menu-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#2b2118;transition:.12s}
  .send-menu-item:hover{background:#f7f1e7}
  .send-menu-item .send-sub{font-size:10.5px;font-weight:600;color:#a3937d;margin-left:auto}
  .send-menu-item.disabled{color:#bcae9a}
  .detail-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .detail-icon.ok{background:#e4edd3}
  .detail-icon.falt{background:#f7dfcb}
  .detail-icon.cerr{background:#faedd6}
  .detail-icon.nd{background:#eadfcd}
  .detail-name{font-size:24px;font-weight:700;letter-spacing:-.4px;color:#2b2118}
  .detail-addr{font-size:13px;color:#8c7b66;margin-top:4px}

  .detail-block{background:#fff;border:1px solid #efe4d3;border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(72,52,32,.04)}
  .detail-block-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:#2b2118}
  .detail-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .d-col{min-width:0}
  .d-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#a3937d;margin-bottom:8px}
  .d-title.bad{color:#c45a2d}
  .ulist{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;padding-right:4px}
  .ulist .it{font-size:12.5px;padding:4px 0;border-bottom:1px solid #f3ebe0;color:#4a4034}
  .ulist .it:last-child{border:none}
  .ulist .it.miss{color:#a3512b}
  .ulist.empty-note{color:#bcae9a;font-style:italic;font-size:12px}

  /* ── Círculos de faltantes (resumen visual por sucursal) ── */
  .miss-circles{display:flex;gap:20px;flex-wrap:wrap;padding:4px 0 6px}
  .miss-circle-item{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:100px}
  .miss-circle{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid;line-height:1.1;transition:.2s}
  .miss-circle .mc-emoji{font-size:18px;margin-bottom:3px}
  .miss-circle .mc-num{font-size:28px;font-weight:700}
  .miss-circle .mc-de{font-size:10px;font-weight:700;opacity:.62;margin-top:-1px;letter-spacing:.3px}
  .miss-circle .mc-na{font-size:11px;font-weight:700;letter-spacing:.2px}
  .miss-circle.na{background:#f4efe6;border-color:#ddcdb4;color:#a3937d}
  .miss-circle.zero{background:#f0f6e4;border-color:#b9d194;color:#4f6b2a}
  .miss-circle.nonzero{background:#fdeee3;border-color:#e4a878;color:#c45a2d}
  .miss-circle-label{font-size:11.5px;font-weight:700;color:#6f6252;text-align:center;text-transform:uppercase;letter-spacing:.4px;max-width:120px}
  .miss-details{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .miss-list-group{display:flex;flex-direction:column;gap:4px}
  .miss-list-label{font-size:12px;font-weight:700;color:#a3512b;letter-spacing:.2px}
  .miss-list{list-style:none;display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
  .miss-list li{font-size:12px;background:#fdeee3;color:#a3512b;border:1px solid #f0cdb0;border-radius:6px;padding:3px 9px;font-weight:600}

  /* ── Gráfico de tendencia ── */
  .surtido-chart-wrap{padding:4px 0 0}
  .surtido-svg{width:100%;height:140px;display:block;overflow:visible}
  .surtido-chart-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#a3937d}
  .surtido-chart-cur{font-weight:700;color:#2b2118;font-size:12.5px}

  /* Back button */
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e3d5c0;color:#6f6252;font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;margin-bottom:16px}
  .back-btn:hover{border-color:#c9b696;color:#2b2118}

  /* ── Historial ── */
  .hist-dates-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .hist-date-btn{background:#fff;border:1px solid #e3d5c0;color:#6f6252;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;transition:.15s}
  .hist-date-btn:hover{border-color:#c9b696;color:#2b2118}
  .hist-date-btn.active{background:#f7dfcb;border-color:#e0b48c;color:#a3512b}
  .hist-date-btn.same{color:#a3937d;background:#faf6ef}
  .hist-date-btn.same.active{background:#f7dfcb;color:#a3512b}
  .hdb-same{font-weight:800;opacity:.75;margin-left:1px}
  .hist-meta{font-size:11.5px;color:#8c7b66;margin-bottom:12px}
  .hist-snap-head{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:12px 15px;margin-bottom:14px;
    border-radius:12px;background:#faf6ef;border:1px solid #efe4d3;
    border-left:3px solid #c9bba6}
  .hist-snap-head.actual{border-left-color:#6a8f36;background:#f4f7ec}
  .hist-snap-head .hsh-fecha{font-size:14.5px;font-weight:700;color:#2b2118;flex-basis:100%}
  .hist-snap-head .hsh-sub{font-size:11.5px;color:#8c7b66}
  .hist-snap-head .hsh-tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .hist-snap-head .hsh-tag.ok{background:#e4edd3;color:#4f6b2a}
  .hist-snap-head .hsh-tag.old{background:#eadfcd;color:#8c7b66}
  .hist-revis{background:#f4f7ec;border:1px solid #dbe6c8;border-radius:10px;padding:9px 14px;
    color:#4f6b2a;font-size:12px;margin-bottom:14px;line-height:1.5}
  .hist-revis strong{font-weight:700}
  .hist-empty{color:#bcae9a;font-style:italic;font-size:12.5px;padding:6px 0}
  .hist-cerrada-banner{background:#faedd6;border:1px solid #f0dcb4;border-radius:10px;padding:10px 14px;color:#8a5d1c;font-size:12px;display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}

  /* Loading / error */
  .status-msg{text-align:center;padding:80px 20px;color:#a3937d;font-size:14px}
  .loader{display:inline-block;width:32px;height:32px;border:3px solid #eadfcd;border-top-color:#c45a2d;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Scrollbar */
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#d8c8b0;border-radius:4px}

  /* ── Botón + modal "PEYA CERRADO" ── */
  .head-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cierres-btn{display:inline-flex;align-items:center;gap:8px;background:#faedd6;
    border:1px solid #ecd3a6;color:#8a5d1c;font-size:12.5px;font-weight:700;
    padding:11px 15px;border-radius:10px;cursor:pointer;transition:.16s;white-space:nowrap;
    letter-spacing:.3px}
  .cierres-btn:hover{background:#f6e2bf;border-color:#dfbe86;transform:translateY(-1px)}
  .cierres-btn .cb-count{background:#efd7a8;border-radius:999px;padding:1px 7px;font-size:11px}

  .cierres-overlay{position:fixed;inset:0;background:rgba(43,33,24,.42);backdrop-filter:blur(4px);
    z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .cierres-overlay.open{display:flex}
  .cierres-modal{background:#fff;border:1px solid #e3d5c0;border-radius:18px;
    width:100%;max-width:430px;max-height:min(78vh,640px);display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(72,52,32,.28);overflow:hidden;
    animation:cierresIn .18s cubic-bezier(.2,.8,.3,1)}
  @keyframes cierresIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .cierres-head{padding:20px 22px 16px;border-bottom:1px solid #f0e7d9;
    display:flex;align-items:flex-start;gap:12px}
  .cierres-badge{width:40px;height:40px;border-radius:11px;background:#faedd6;
    display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .cierres-title{font-size:13px;font-weight:800;letter-spacing:1.2px;color:#b07a2e;text-transform:uppercase}
  .cierres-suc{font-size:16px;font-weight:700;color:#2b2118;margin-top:3px;line-height:1.2}
  .cierres-x{margin-left:auto;background:none;border:none;color:#a3937d;font-size:22px;
    cursor:pointer;line-height:1;padding:2px 4px;border-radius:7px;transition:.14s}
  .cierres-x:hover{color:#2b2118;background:#f4ede2}
  .cierres-sub{padding:13px 22px;font-size:12px;color:#6f6252;background:#fdf8ef;
    border-bottom:1px solid #f0e7d9}
  .cierres-sub b{color:#a3512b;font-weight:700}
  .cierres-list{overflow-y:auto;padding:8px 12px 14px}
  .cierres-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:9px;transition:.12s}
  .cierres-row:hover{background:#faf6ef}
  .cierres-dot{width:8px;height:8px;border-radius:50%;background:#d9a441;flex-shrink:0;
    box-shadow:0 0 0 3px rgba(217,164,65,.18)}
  .cierres-fecha{font-size:13.5px;font-weight:600;color:#2b2118}
  .cierres-rel{font-size:11px;color:#a3937d;margin-top:1px}
  .cierres-hora{margin-left:auto;font-size:12px;font-weight:700;color:#6f6252;
    background:#f4ede2;padding:3px 9px;border-radius:7px;flex-shrink:0}
  .cierres-foot{padding:12px 22px 16px;font-size:11px;color:#a3937d;border-top:1px solid #f0e7d9;line-height:1.5}
  .cierres-empty{padding:34px 22px;text-align:center;color:#bcae9a;font-size:13px}
  @media(max-width:780px){
    .head-actions{width:100%;flex-direction:column;align-items:stretch}
    .cierres-btn{justify-content:center}
  }

  /* Mobile */
  @media(max-width:780px){
    .topbar{padding:12px 16px;gap:12px}
    .topbar-logo{height:36px}
    .topbar-title{font-size:16px}
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid #e3d5c0;padding:12px 12px 14px;max-height:none}
    .detail{padding:18px 14px 40px}
    .detail-cols{grid-template-columns:1fr}
    .detail-head-row{flex-wrap:wrap}
    .send-wrap{width:100%}
    .send-btn{width:100%;justify-content:center}
    .send-menu{left:0;right:0;width:100%}
    .miss-circles{justify-content:center;gap:18px}
    .miss-circle{width:84px;height:84px}
    .miss-circle .mc-num{font-size:26px}
  }
</style>
</head>

    if(data.updated_at){
      const d = new Date(data.updated_at);
      document.getElementById('updTime').textContent =
        'Actualizado: ' + d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    }
    renderSidebar();
    renderDetail();
  } catch(e){
    document.getElementById('detail').innerHTML =
      '<div class="status-msg">❌ No se pudieron cargar los datos.<br><small>'+e.message+'</small></div>';
  }
}

function missCount(s){
  return (s.miss_sabores||[]).length + (s.miss_guapaletas||[]).length
       + (s.miss_paletas||[]).length + (s.miss_helados||[]).length;
}
// Una sucursal que no vende la línea no tiene faltantes de esa línea: no es que
// le falte, es que no es su rubro. Se muestra "no vende" en gris, no un cero rojo.
function vendeLinea(s, k){ return ((k==='g' ? s.guapaletas : s.paletas)||[]).length > 0; }

function cierresButtonHtml(s){
  const n = (s.cierres||[]).length;
  if(!n) return '';
  return '<button class="cierres-btn" onclick="openCierres(\''+cssSafe(s.nombre)+'\')" '
       + 'title="Ver las fechas en que apareci\u00f3 cerrada">&#128274; PEYA CERRADO'
       + '<span class="cb-count">'+n+'</span></button>';
}

function fmtFechaCierre(ts){
  const d = new Date(ts);
  if(isNaN(d)) return {fecha: String(ts).slice(0,10), hora: '', rel: ''};
  let fecha = d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  fecha = fecha.charAt(0).toUpperCase() + fecha.slice(1);   // 's\u00e1bado, 29 de agosto' -> 'S\u00e1bado, ...'
  const hora  = d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  const dias  = Math.round((Date.now() - d.getTime()) / 86400000);
  const rel   = dias <= 0 ? 'hoy' : (dias === 1 ? 'ayer' : 'hace ' + dias + ' d\u00edas');
  return {fecha, hora, rel};
}

function openCierres(id){
  const s = (DATA && DATA.sucursales || []).find(x => cssSafe(x.nombre) === id);
  if(!s) return;
  const lista = (s.cierres || []).slice(0, 10);
  document.getElementById('cierresSuc').textContent = s.nombre;
  document.getElementById('cierresSub').innerHTML =
    lista.length === 1 ? 'Registrada como cerrada <b>1 vez</b>.'
                       : 'Registrada como cerrada <b>' + lista.length + ' veces</b>. '
                         + 'Se muestran las m\u00e1s recientes.';
  document.getElementById('cierresList').innerHTML = lista.length
    ? lista.map(function(ts){
        const f = fmtFechaCierre(ts);
        return '<div class="cierres-row"><span class="cierres-dot"></span>'
             + '<div><div class="cierres-fecha">'+f.fecha+'</div>'
             + '<div class="cierres-rel">'+f.rel+'</div></div>'
             + (f.hora ? '<span class="cierres-hora">'+f.hora+'</span>' : '')
             + '</div>';
      }).join('')
    : '<div class="cierres-empty">Todav\u00eda no hay cierres registrados.</div>';
  document.getElementById('cierresOverlay').classList.add('open');
}

function closeCierres(){
  document.getElementById('cierresOverlay').classList.remove('open');
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeCierres();
});

function statusOf(s){
  // Abierta/cerrada y faltantes son dos datos independientes: el estado del
  // local ya no esconde lo que le falta. La fábrica también se mide.
  const cerrTag = s.cerrada ? '<span class="tag cerr">🔒 Cerrada</span>' : '';
  const fabTag  = s.esFabrica ? '<span class="tag ok" style="background:#ece5f7;color:#7a5aa8;border-color:#ddd2ee">🏭 Fábrica (referencia)</span>' : '';
  if(s.sin_datos) return {iconClass:'nd', emoji:'–', tagHtml: fabTag+cerrTag+'<span class="tag nd">Sin datos</span>'};
  const m = missCount(s);
  const missTag = m>0 ? '<span class="tag falt">'+m+' faltantes</span>'
                      : '<span class="tag ok">✓ Completa</span>';
  return {iconClass: m>0?'falt':'ok', emoji: m>0?'!':'✓', tagHtml: fabTag+cerrTag+missTag};
}

function selectSuc(nombre){
  selectedNombre = nombre;
  renderSidebar();
  renderDetail();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderSidebar(){
  if(!DATA) return;
  const sucs = DATA.sucursales || [];
  const clientSucs = sucs;   // la fábrica también se mide, así que también cuenta
  const totalFalt = clientSucs.filter(s=>!s.sin_datos&&missCount(s)>0).length;
  const totalOk   = clientSucs.filter(s=>!s.sin_datos&&missCount(s)===0).length;
  const totalCerr = clientSucs.filter(s=>s.cerrada).length;
  const totalSD   = clientSucs.filter(s=>s.sin_datos).length;

  document.getElementById('sidebarSummary').innerHTML =
    (totalFalt>0?'<span class="mini-chip warn">'+totalFalt+' con faltantes</span>':'')
    +'<span class="mini-chip ok">'+totalOk+(totalOk===1?' completa':' completas')+'</span>'
    +(totalSD>0?'<span class="mini-chip neu">'+totalSD+' sin datos</span>':'')
    +(totalCerr>0?'<span class="mini-chip neu">'+totalCerr+(totalCerr===1?' cerrada':' cerradas')+'</span>':'');

  const list = document.getElementById('sucList');
  list.innerHTML = '';

  const ov = document.createElement('div');
  ov.className = 'suc-item overview-item' + (selectedNombre==='__overview__' ? ' active' : '');
  ov.onclick = function(){ selectSuc('__overview__'); };
  ov.innerHTML = '<span class="li-name">📊 Resumen general</span>';
  list.appendChild(ov);

  const div = document.createElement('div');
  div.className = 'sidebar-divider';
  list.appendChild(div);

  sucs.forEach(s=>{
    const m = missCount(s);
    const it = document.createElement('div');
    it.className = 'suc-item' + (s.esFabrica ? ' fab-item' : '') + (s.nombre===selectedNombre ? ' active' : '');
    it.onclick = function(){ selectSuc(s.nombre); };
    let right = '';
    if(s.esFabrica) right += '<span class="fab-tag">FÁBRICA</span>';
    if(s.cerrada)   right += '<span class="closed-tag">CERRADO</span>';
    if(s.sin_datos) right += '<span class="nodata-tag" title="No se pudo leer el menú">SIN DATOS</span>';
    else if(m===0)  right += '<span class="ok-tag" title="Todo disponible">COMPLETA</span>';
    else            right += '<span class="li-badge" title="Faltantes totales">'+m+'</span>';
    it.innerHTML = '<span class="li-name">'+(s.esFabrica?'🏭 ':'')+s.nombre+'</span>'+right;
    list.appendChild(it);
    if(s.esFabrica){
      const div2 = document.createElement('div');
      div2.className = 'sidebar-divider';
      list.appendChild(div2);
    }
  });
}

function ulist(items, cls){
  if(!items || !items.length) return '<div class="ulist empty-note">— ninguno —</div>';
  return '<div class="ulist">' + items.map(n=>'<div class="it'+(cls?(' '+cls):'')+'">'+n+'</div>').join('') + '</div>';
}

function renderDetail(){
  if(!DATA) return;
  if(selectedNombre === '__overview__'){
    renderOverview();
  } else {
    const s = (DATA.sucursales||[]).find(x=>x.nombre===selectedNombre);
    if(!s){ renderOverview(); return; }
    renderSucDetail(s);
  }
}

function renderOverview(){
  const sucs = DATA.sucursales || [];
  const clientSucs = sucs;   // la fábrica también se mide, así que también cuenta
  const totalFalt = clientSucs.filter(s=>!s.sin_datos&&missCount(s)>0).length;
  const totalOk   = clientSucs.filter(s=>!s.sin_datos&&missCount(s)===0).length;
  const totalCerr = clientSucs.filter(s=>s.cerrada).length;

  let html = '<div class="summary-bar">'
    + '<div class="sum-card '+(totalFalt>0?'warn':'ok')+'"><div class="num">'+totalFalt+'</div><div class="lbl">Con faltantes</div></div>'
    + '<div class="sum-card ok"><div class="num">'+totalOk+'</div><div class="lbl">Completas</div></div>'
    + '<div class="sum-card"><div class="num" style="color:#b07a2e">'+totalCerr+'</div><div class="lbl">Cerradas</div></div>'
    + '<div class="sum-card"><div class="num" style="color:#7a5aa8">'+clientSucs.length+'</div><div class="lbl">Sucursales</div></div>'
    + '</div>';

  html += '<div class="grid">';
  sucs.forEach(s=>{
    const st = statusOf(s);
    let cardClass = 'card';
    if(s.sin_datos) cardClass += ' sin-datos';
    else if(s.cerrada) cardClass += ' cerrada';
    else if(missCount(s)>0) cardClass += ' has-falt';
    else cardClass += ' all-ok';

    // La tarjeta es el RESUMEN: tres números, uno por línea de producto.
    // El detalle de qué falta está al clickearla — antes la lista roja
    // desbordaba la tarjeta y el número del encabezado (lo que tiene) se
    // confundía con la lista de abajo (lo que falta).
    function miniFila(icono, etiqueta, faltan, total, vende){
      let val;
      if(!vende)            val = '<span class="mr-val na">no vende</span>';
      else if(faltan === 0) val = '<span class="mr-val ok">'+total+'<span class="mr-de"> de '+total+'</span></span>';
      else                  val = '<span class="mr-val bad">'+(total-faltan)+'<span class="mr-de"> de '+total+'</span></span>';
      return '<div class="mini-row"><span class="mr-ico">'+icono+'</span>'
           + '<span class="mr-label">'+etiqueta+'</span>'+val+'</div>';
    }
    let body = '';
    if(s.esFabrica){
      body = '<div class="fab-banner">🏭 Sucursal fábrica. Se mide igual que el resto contra el catálogo.</div>';
    }
    if(s.cerrada){
      body += '<div class="cerr-banner">🔒 Cerrada ahora — no está tomando pedidos. Los datos están medidos igual.</div>';
    }
    if(!s.sin_datos){
      const nSab  = (s.sabores||[]).length     + (s.miss_sabores||[]).length;
      const nGuap = (s.guapaletas||[]).length  + (s.miss_guapaletas||[]).length;
      const nPal  = (s.paletas||[]).length     + (s.miss_paletas||[]).length;
      body += '<div class="mini-rows">'
        + miniFila('🍨','Sabores',          (s.miss_sabores||[]).length,    nSab,  true)
        + miniFila('🍡','Guapaletas',       (s.miss_guapaletas||[]).length, nGuap, vendeLinea(s,'g'))
        + miniFila('🍭','Paletas comunes',  (s.miss_paletas||[]).length,    nPal,  vendeLinea(s,'p'))
        + '</div>';
    }

    const card = document.createElement('div');
    // se construye como string porque innerHTML += en loop de grid es más simple
    html += '<div class="'+cardClass+'" onclick="selectSuc(\''+s.nombre.replace(/'/g,"\\'")+'\')">'
      + '<div class="card-head">'
      + '<div class="card-icon '+st.iconClass+'">'+st.emoji+'</div>'
      + '<div><div class="card-name">'+s.nombre+'</div><div class="card-addr">'+(s.direccion||'')+'</div></div>'
      + '</div>'
      + '<div class="tags">'+st.tagHtml+'</div>'
      + body
      + '</div>';
  });
  html += '</div>';

  document.getElementById('detail').innerHTML = html;
}

function renderSucDetail(s){
  const st = statusOf(s);
  let html = '<div class="back-btn" onclick="selectSuc(\'__overview__\')">&larr; Volver al resumen</div>';

  html += '<div class="detail-head-row">';
  html += '<div class="detail-head">'
    + '<div class="detail-icon '+st.iconClass+'">'+st.emoji+'</div>'
    + '<div><div class="detail-name">'+s.nombre+'</div><div class="detail-addr">'+(s.direccion||'')+'</div>'
    + '<div class="tags" style="margin-top:8px">'+st.tagHtml+'</div></div>'
    + '</div>';
  html += '<div class="head-actions">' + cierresButtonHtml(s)
        + (s.esFabrica ? '' : sendButtonHtml(s)) + '</div>';
  html += '</div>'; // cierre detail-head-row

  if(s.esFabrica){
    html += '<div class="fab-banner">🏭 Esta es la sucursal fábrica: se usa como referencia para calcular los faltantes del resto de las sucursales.</div>';
  }
  if(s.cerrada){
    html += '<div class="detail-block"><div class="cerr-banner">🔒 Cerrada ahora — no está tomando pedidos en PedidosYa. Los faltantes de abajo están medidos igual.</div></div>';
  }
  if(s.sin_datos){
    html += '<div class="detail-block"><div class="ulist empty-note">Todavía no hay datos relevados para esta sucursal.</div></div>';
  } else {
    const mh = s.miss_helados||[], ms_h = s.miss_sabores||[],
          mg = s.miss_guapaletas||[], mp = s.miss_paletas||[];
    let missListHtml = '';
    function grupo(icono, titulo, arr){
      return arr.length ? '<div class="miss-list-group"><div class="miss-list-label">'+icono+' '+titulo
           +'</div><ul class="miss-list">'+arr.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul></div>' : '';
    }
    missListHtml += grupo('🍦','Helados faltantes', mh);
    missListHtml += grupo('🍨','Sabores faltantes', ms_h);
    missListHtml += grupo('🍡','Guapaletas faltantes', mg);
    missListHtml += grupo('🍭','Paletas comunes faltantes', mp);
    const totG = (s.guapaletas||[]).length + mg.length,
          totP = (s.paletas||[]).length + mp.length;
    html += '<div class="detail-block">'
      + '<div class="detail-block-title">📊 Disponibilidad</div>'
      + '<div class="miss-circles">'
      + missCircleHtml('🍨', 'Sabores', ms_h.length, (s.sabores||[]).length + ms_h.length)
      + missCircleHtml('🍡', 'Guapaletas', mg.length, totG, !vendeLinea(s,'g'))
      + missCircleHtml('🍭', 'Paletas comunes', mp.length, totP, !vendeLinea(s,'p'))
      + missCircleHtml('🍦', 'Productos / Promos', mh.length)
      + '</div>'
      + (missListHtml ? '<div class="miss-details">'+missListHtml+'</div>' : '')
      + '</div>';
  }

  // ── Gráfico de tendencia: sabores surtidos a lo largo del historial ──
  html += '<div class="detail-block">'
    + '<div class="detail-block-title">📈 Tendencia de sabores surtidos</div>'
    + '<div class="surtido-chart-wrap" id="surtidoChart_'+cssSafe(s.nombre)+'"></div>'
    + '</div>';

  // ── Historial ──
  html += '<div class="detail-block" id="histBlock">'
    + '<div class="detail-block-title">💾 Historial guardado</div>'
    + '<div id="histInner_'+cssSafe(s.nombre)+'"></div>'
    + '</div>';

  document.getElementById('detail').innerHTML = html;
  renderHistorial(s);
  renderSurtidoChart(s);
}

// ── Gráfico de "qué tan surtido" está (sabores disponibles) en cada snapshot del historial ──
function renderSurtidoChart(s){
  const wrap = document.getElementById('surtidoChart_'+cssSafe(s.nombre));
  if(!wrap) return;
  const histAll = s.historial || [];
  if(histAll.length < 2){
    wrap.innerHTML = '<div class="ulist empty-note">Hace falta guardar al menos 2 snapshots de historial para ver la tendencia.</div>';
    return;
  }
  // El historial viene del más nuevo al más viejo; para el gráfico lo queremos en orden cronológico.
  const points = [...histAll].reverse().map(h => ({ ts: h.ts, val: (h.sabores||[]).length }));

  const W = 600, H = 168, padL = 22, padR = 22, padT = 26, padB = 30;
  const maxVal = Math.max.apply(null, points.map(p=>p.val).concat([1]));
  const n = points.length;
  const stepX = (W - padL - padR) / Math.max(n - 1, 1);
  const coords = points.map((p,i)=>{
    const x = padL + i * stepX;
    const y = padT + (H - padT - padB) * (1 - (p.val / maxVal));
    return {x:x, y:y, ts:p.ts, val:p.val};
  });

  const pathD = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaD = pathD + ' L' + coords[coords.length-1].x.toFixed(1) + ',' + (H-padB) + ' L' + coords[0].x.toFixed(1) + ',' + (H-padB) + ' Z';

  // Con muchos puntos las fechas se pisan: se muestra 1 de cada N.
  const saltoFecha = Math.max(1, Math.ceil(n / 8));
  const dotsHtml = coords.map((c,i)=>{
    const dt = new Date(c.ts);
    const lbl = dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    // El valor va ESCRITO sobre el punto: antes solo estaba en el tooltip y en
    // celular no se veía nunca. Los extremos se corren para no salirse del SVG.
    const anchor = i===0 ? 'start' : (i===coords.length-1 ? 'end' : 'middle');
    const tx = i===0 ? c.x-6 : (i===coords.length-1 ? c.x+6 : c.x);
    const fecha = dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
    const mostrarFecha = (i % saltoFecha === 0) || i === coords.length-1;
    const fechaTxt = mostrarFecha
      ? '<text x="'+tx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="'+anchor+'"'
        + ' font-size="10.5" fill="#a3937d">'+fecha+'</text>' : '';
    return '<text x="'+tx.toFixed(1)+'" y="'+(c.y-11).toFixed(1)+'" text-anchor="'+anchor+'"'
         + ' font-size="12" font-weight="700" fill="#6f6252">'+c.val+'</text>'
         + fechaTxt
         + '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="4" fill="#ffffff" stroke="url(#surtidoGrad_'+cssSafe(s.nombre)+')" stroke-width="2.5"><title>'+lbl+' — '+c.val+' sabores surtidos</title></circle>';
  }).join('');

  const lastVal  = coords[coords.length-1].val;

  wrap.innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" class="surtido-svg" preserveAspectRatio="xMidYMid meet">'
    + '<defs><linearGradient id="surtidoGrad_'+cssSafe(s.nombre)+'" x1="0" y1="1" x2="0" y2="0">'
    +   '<stop offset="0%" stop-color="#c45a2d"/>'
    +   '<stop offset="55%" stop-color="#d9a441"/>'
    +   '<stop offset="100%" stop-color="#6a8f36"/>'
    + '</linearGradient></defs>'
    + '<path d="'+areaD+'" fill="url(#surtidoGrad_'+cssSafe(s.nombre)+')" opacity="0.14" stroke="none"></path>'
    + '<path d="'+pathD+'" fill="none" stroke="url(#surtidoGrad_'+cssSafe(s.nombre)+')" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>'
    + dotsHtml
    + '</svg>'
    + '<div class="surtido-chart-foot">'
    +   '<span class="surtido-chart-cur" style="margin:0 auto">Último: '+lastVal+' sabores surtidos</span>'
    + '</div>';
}

function cssSafe(nombre){
  return nombre.replace(/[^a-zA-Z0-9_]/g,'_');
}

function missCircleHtml(emoji, label, count, total, noVende){
  if(noVende){
    return '<div class="miss-circle-item">'
      + '<div class="miss-circle na"><div class="mc-emoji">'+emoji+'</div><div class="mc-na">no vende</div></div>'
      + '<div class="miss-circle-label">'+label+'</div></div>';
  }
  const cls = count>0 ? 'nonzero' : 'zero';
  const hayTot = (typeof total === 'number' && total > 0);
  // Se muestra lo DISPONIBLE, no lo que falta: "39 de 41", no "2 de 41".
  const num = hayTot ? (total - count) : count;
  const pie = hayTot ? '<div class="mc-de">de '+total+'</div>' : '';
  return '<div class="miss-circle-item">'
    + '<div class="miss-circle '+cls+'"><div class="mc-emoji">'+emoji+'</div>'
    + '<div class="mc-num">'+num+'</div>'+pie+'</div>'
    + '<div class="miss-circle-label">'+label+'</div>'
    + '</div>';
}

// ── Botón "Enviar faltantes" (Email / WhatsApp, según contacto en la ficha) ──

function toggleSendMenu(e, id){
  e.stopPropagation();
  const menu = document.getElementById('sendMenu_'+id);
  if(!menu) return;
  const wasOpen = menu.classList.contains('open');
  document.querySelectorAll('.send-menu.open').forEach(m=>m.classList.remove('open'));
  if(!wasOpen) menu.classList.add('open');
}
document.addEventListener('click', function(){
  document.querySelectorAll('.send-menu.open').forEach(m=>m.classList.remove('open'));
});

function buildFaltantesMsg(s){
  const lines = [];
  lines.push('Reporte de faltantes — ' + s.nombre);
  lines.push('Fecha: ' + new Date().toLocaleString('es-AR'));
  lines.push('');
  if(s.sin_datos){
    lines.push('Todavía no hay datos relevados para esta sucursal.');
    return lines.join('\n');
  }
  if(s.cerrada){
    lines.push('🔒 La sucursal está cerrada en PedidosYa en este momento.');
    lines.push('');
  }
  const ms = s.miss_sabores||[], mg = s.miss_guapaletas||[], mh = s.miss_helados||[];
  if(ms.length){
    lines.push('Sabores faltantes (Helado x Kilo):');
    ms.forEach(f=>lines.push('- '+f));
    lines.push('');
  }
  if(mg.length){
    lines.push('Guapaletas faltantes:');
    mg.forEach(f=>lines.push('- '+f));
    lines.push('');
  }
  if(mh.length){
    lines.push('Helados (productos) faltantes:');
    mh.forEach(f=>lines.push('- '+f));
    lines.push('');
  }
  if(!ms.length && !mg.length && !mh.length){
    lines.push('✓ No hay faltantes registrados para esta sucursal.');
  }
  return lines.join('\n');
}

function sendVia(e, channel, nombre){
  e.stopPropagation();
  const s = (DATA.sucursales||[]).find(x=>x.nombre===nombre);
  if(!s) return;
  const msg = buildFaltantesMsg(s);
  if(channel==='email'){
    if(!s.email){
      alert('Esta sucursal todavía no tiene un email configurado.\nPodés agregarlo desde el panel admin, en la ficha de la sucursal.');
      return;
    }
    const subject = encodeURIComponent('Faltantes — '+s.nombre);
    const body = encodeURIComponent(msg);
    window.location.href = 'mailto:'+s.email+'?subject='+subject+'&body='+body;
  } else if(channel==='whatsapp'){
    if(!s.whatsapp){
      alert('Esta sucursal todavía no tiene un WhatsApp configurado.\nPodés agregarlo desde el panel admin, en la ficha de la sucursal.');
      return;
    }
    const phone = s.whatsapp.replace(/[^0-9]/g,'');
    const text = encodeURIComponent(msg);
    window.open('https://wa.me/'+phone+'?text='+text, '_blank');
  }
}

function renderHistorial(s){
  const cont = document.getElementById('histInner_'+cssSafe(s.nombre));
  if(!cont) return;
  const hist = s.historial || [];
  if(!hist.length){
    cont.innerHTML = '<div class="hist-empty">Sin historial guardado aún para esta sucursal</div>';
    return;
  }
  if(histSelIdx[s.nombre]===undefined) histSelIdx[s.nombre]=0;
  const idx = Math.min(histSelIdx[s.nombre], hist.length-1);
  const entry = hist[idx];

  let datesHtml = '<div class="hist-dates-bar">';
  hist.forEach((h,i)=>{
    const dt = new Date(h.ts);
    const lbl = dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'})
              + ' ' + dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    const closedMark = h.cerrada ? ' 🔒' : '';
    const vMark = h.version ? (' · v'+h.version) : '';
    const sameMark = h.sin_cambios ? ' <span class="hdb-same" title="Sin cambios respecto del anterior">=</span>' : '';
    datesHtml += '<button class="hist-date-btn'+(i===idx?' active':'')+(h.sin_cambios?' same':'')+'" onclick="selectHist(\''+s.nombre.replace(/'/g,"\\'")+'\','+i+')">'+lbl+vMark+closedMark+sameMark+'</button>';
  });
  datesHtml += '</div>';

  const prod = entry.products || [];
  const sab  = entry.sabores  || [];

  // El snapshot es una FOTO VIEJA. Antes decía "Sabores (18)" a secas, treinta
  // píxeles abajo del dato de hoy — y se leía como si el sistema se contradijera.
  const dEnt = new Date(entry.ts);
  const dias = Math.round((Date.now() - dEnt.getTime()) / 86400000);
  const cuando = dias <= 0 ? 'hoy' : (dias === 1 ? 'ayer' : 'hace ' + dias + ' días');
  const esActual = idx === 0;
  let snap = '<div class="hist-snap-head'+(esActual?' actual':'')+'">'
    + '<div class="hsh-fecha">' + dEnt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
      .replace(/^./, m=>m.toUpperCase()) + '</div>'
    + '<div class="hsh-sub">' + dEnt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
      + ' · ' + cuando + (entry.version ? ' · v'+entry.version : '')
      + ' — ' + prod.length + ' productos · ' + sab.length + ' sabores</div>'
    + (esActual ? '<span class="hsh-tag ok">último relevamiento</span>'
                : '<span class="hsh-tag old">foto anterior</span>')
    + '</div>';
  // Entradas viejas (modo anterior) pueden traer 'revisiones'; se siguen mostrando.
  const revs = (entry.revisiones||[]).filter(function(r){ return (r||'').slice(0,10) > (entry.ts||'').slice(0,10); });
  if(revs.length){
    const ult = new Date(revs[revs.length-1]);
    snap += '<div class="hist-revis">🔁 <strong>Sin cambios desde entonces.</strong> '
          + 'Se volvió a controlar ' + revs.length + (revs.length===1?' vez':' veces')
          + ', la última el ' + ult.toLocaleDateString('es-AR',{day:'numeric',month:'long'})
          + ' — mismos productos y sabores.</div>';
  }
  if(entry.sin_lectura){
    snap += '<div class="hist-cerrada-banner"><span>⚠</span><div><strong>No se pudo leer esta sucursal</strong>'
          + '<div style="font-weight:400;font-size:12px;opacity:.85;margin-top:2px">'
          + (entry.motivo ? 'Motivo: '+entry.motivo+'. ' : '')
          + 'Queda registrado el control, pero sin datos de productos.</div></div></div>';
  } else if(entry.sin_cambios){
    snap += '<div class="hist-revis">🔁 <strong>Sin cambios</strong> respecto del control anterior — mismos productos y sabores.</div>';
  }
  if(entry.cerrada){
    snap += '<div class="hist-cerrada-banner"><span>🔒</span><div><strong>Sucursal cerrada</strong><div style="font-weight:400;font-size:12px;opacity:.8;margin-top:2px">Este snapshot se guardó cuando la sucursal estaba cerrada.</div></div></div>';
  }
  const fechaCorta = dEnt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
  snap += '<div class="detail-cols">'
    + '<div class="d-col"><div class="d-title">Productos al '+fechaCorta+' ('+prod.length+')</div>'+ulist(prod)+'</div>'
    + '<div class="d-col"><div class="d-title">Sabores al '+fechaCorta+' ('+sab.length+')</div>'+ulist(sab)+'</div>'
    + '</div>';

  cont.innerHTML = datesHtml + snap;
}

function selectHist(nombre, idx){
  histSelIdx[nombre] = idx;
  const s = (DATA.sucursales||[]).find(x=>x.nombre===nombre);
  if(s) renderHistorial(s);
}

// Carga inicial + auto-refresh cada 10 minutos
loadData();
setInterval(loadData, 10*60*1000);
